services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - API_CORS_ORIGINS=["http://localhost:3000"]

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
