name: Deploy

# Pushes to main SSH into the EC2 host and run ~/deploy.sh (git pull, compose up).
# The host's authorized_keys also pins the deploy key to that script as a forced
# command, so a leaked key can only redeploy main. Naming the script here too means
# a key installed without the forced command still deploys, and a missing script
# fails the job instead of passing silently.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "ubuntu@$DEPLOY_HOST" /home/ubuntu/deploy.sh
