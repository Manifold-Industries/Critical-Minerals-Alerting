name: Deploy

# Pushes to main SSH into the EC2 host. The deploy key is pinned in the host's
# authorized_keys to a forced command (~/deploy.sh: git pull, compose up), so
# the runner sends no command and the key can do nothing but redeploy main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.DEPLOY_HOST }}
